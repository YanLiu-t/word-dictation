[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "word-dictation"
version = "1.1.0"
description = "手写英语单词笔记照片 → 分页词表 → 中英交替听写音频"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.0.0",
    "lameenc>=1.7.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.30"]

[project.scripts]
dictation = "dictation.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
